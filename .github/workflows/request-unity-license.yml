name: Request Unity Activation File (.alf)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/request-unity-license.yml'

jobs:
  requestManualActivation:
    name: Generate Unity Activation File (.alf)
    runs-on: ubuntu-latest

    steps:
      - name: Generate .alf using official UnityCI Docker image
        shell: bash
        run: |
          docker run --rm -v "$PWD:/work" -w /work unityci/editor:ubuntu-2022.3.50f1-base-3 bash -c '
            UNITY_BIN=$(command -v unity-editor || echo /opt/unity/Editor/Unity)
            "$UNITY_BIN" -batchmode -nographics -logFile /dev/stdout -createManualActivationFile -quit || true
          '
          ls -lh *.alf

      - name: Upload .alf Activation File
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-File-ALF
          path: '*.alf'
          retention-days: 7
