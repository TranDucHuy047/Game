name: Build iOS App (.ipa)

on:
  workflow_dispatch:

jobs:
  export-xcode-project:
    name: Export iOS Xcode Project (Unity Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Unity License Secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.UNITY_LICENSE }}" ] && [ -z "${{ secrets.UNITY_EMAIL }}" ]; then
            echo "::error::Missing Unity license secrets! Add UNITY_LICENSE (and UNITY_EMAIL / UNITY_PASSWORD) in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: |
            Library-iOS-

      - name: Sanitize Unity Credentials
        shell: bash
        env:
          RAW_LICENSE: ${{ secrets.UNITY_LICENSE }}
          RAW_EMAIL: ${{ secrets.UNITY_EMAIL }}
          RAW_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          CLEAN_EMAIL=$(printf '%s' "$RAW_EMAIL" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          CLEAN_PASS=$(printf '%s' "$RAW_PASSWORD" | tr -d '\r\n')
          CLEAN_LIC=$(printf '%s' "$RAW_LICENSE" | tr -d '\r')

          if [ -n "$CLEAN_EMAIL" ]; then echo "::add-mask::$CLEAN_EMAIL"; fi
          if [ -n "$CLEAN_PASS" ]; then echo "::add-mask::$CLEAN_PASS"; fi

          echo "CLEAN_UNITY_EMAIL=$CLEAN_EMAIL" >> "$GITHUB_ENV"
          echo "CLEAN_UNITY_PASSWORD=$CLEAN_PASS" >> "$GITHUB_ENV"
          {
            echo "CLEAN_UNITY_LICENSE<<__UNITY_LIC_EOF__"
            printf '%s\n' "$CLEAN_LIC"
            echo "__UNITY_LIC_EOF__"
          } >> "$GITHUB_ENV"

      - name: Export iOS Xcode Project from Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ env.CLEAN_UNITY_LICENSE }}
          UNITY_EMAIL: ${{ env.CLEAN_UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ env.CLEAN_UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 2022.3.50f1
          targetPlatform: iOS
          buildMethod: CoralArchipelago.EditorTools.CoralProjectAutoBuilder.BuildiOSXcodeFromCLI
          buildsPath: build

      - name: Package Xcode Project Tarball (Preserves Symlinks & Permissions)
        shell: bash
        run: |
          tar -czf ios-xcode.tar.gz -C build iOS
          ls -lh ios-xcode.tar.gz

      - name: Upload Xcode Project Tarball
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Xcode-Project
          path: ios-xcode.tar.gz
          retention-days: 3

  compile-ios-ipa:
    name: Compile Xcode & Package .ipa (macOS)
    needs: export-xcode-project
    runs-on: macos-latest

    steps:
      - name: Download Xcode Project Tarball
        uses: actions/download-artifact@v4
        with:
          name: iOS-Xcode-Project

      - name: Extract Xcode Project & Restore Script Permissions
        shell: bash
        run: |
          mkdir -p build
          tar -xzf ios-xcode.tar.gz -C build
          find build/iOS -type f \( -name "*.sh" -o -name "MapFileParser*" \) -exec chmod +x {} +

      - name: Compile Xcode Project & Package Unsigned .ipa (for Sideloadly / Xcode)
        shell: bash
        run: |
          set -euo pipefail
          XCODEPROJ=$(find build/iOS -maxdepth 4 -name "Unity-iPhone.xcodeproj" | head -n 1)
          if [ -z "$XCODEPROJ" ]; then
            echo "::error::Unity-iPhone.xcodeproj not found under build/iOS"
            exit 1
          fi

          echo "Found Xcode project: $XCODEPROJ"
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/CoralArchipelago.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

          APP_PATH=$(find build/CoralArchipelago.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Compiled .app bundle not found in archive!"
            exit 1
          fi

          mkdir -p build/ipa_staging/Payload
          cp -R "$APP_PATH" build/ipa_staging/Payload/
          (cd build/ipa_staging && zip -qr ../CoralArchipelago_iOS.ipa Payload)
          ls -lh build/CoralArchipelago_iOS.ipa

      - name: Upload CoralArchipelago_iOS.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoralArchipelago-iOS-IPA
          path: build/CoralArchipelago_iOS.ipa
          retention-days: 14
